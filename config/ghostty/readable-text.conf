# Optional Ghostty text profile for image-backed tmux panes.
# Apply after the theme; keep background/image/opacity settings unchanged.
foreground = #ffffff
palette = 7=#ffffff
palette = 15=#ffffff
# Agent TUIs emit SGR faint even when tmux's default foreground is white.
faint-opacity = 1
# Lift low-contrast ANSI and RGB text without removing semantic colors.
minimum-contrast = 7

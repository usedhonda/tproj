name: tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  shell-suites:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Smoke
        run: bash tests/smoke-bin.sh
      - name: Messaging sendability
        run: bash extensions/messaging/tests/test-sendability-gate.sh
      - name: Role handoff
        run: bash extensions/messaging/tests/test-role-handoff.sh
      - name: Desktop mailbox
        run: bash extensions/messaging/tests/test-desktop-mailbox.sh
      - name: Caller verify hardening
        run: bash extensions/messaging/tests/test-caller-verify-hardening.sh
      # test-registry-contract.sh is excluded here: it executes the canonical
      # model-role-router from the sibling `general` checkout, which is not
      # present in a tproj-only CI checkout (same sibling-general dependency
      # that keeps test-project-bootstrap-contract.sh a local-only contract
      # test). Run it locally where the general checkout exists.
      - name: Inbox check
        run: bash extensions/hooks/tests/test-inbox-check.sh
      - name: Mutation guard
        run: bash extensions/hooks/tests/test-mutation-guard.sh

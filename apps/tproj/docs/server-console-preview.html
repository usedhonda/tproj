<!doctype html>
<html lang="ja">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>tproj — このMacのセッション管理 / Design preview</title>
<style>
:root{color-scheme:dark;--bg:#1e1e2e;--surface:#242434;--raised:#313244;--border:#45475a;--fg:#fff;--secondary:#cdd6f4;--muted:#bac2de;--blue:#89b4fa;--green:#a6e3a1;--peach:#fab387;--red:#f38ba8;--yellow:#f9e2af;font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans',sans-serif;font-size:13px}
*{box-sizing:border-box}body{margin:0;padding:28px 20px;background:#11111b;color:var(--fg)}button,input,select{font:inherit}button,select{cursor:pointer}button{border:1px solid var(--border);border-radius:5px;padding:5px 10px;color:var(--fg);background:var(--raised);white-space:nowrap}button:hover:not(:disabled){background:#41435a}button:disabled{opacity:.42;cursor:default}button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--blue);outline-offset:3px}button.primary{background:var(--blue);color:#11111b;border-color:var(--blue);font-weight:650}button.danger{background:var(--red);border-color:var(--red);color:#11111b}button.quiet{background:transparent}.mono{font-family:'JetBrains Mono',ui-monospace,monospace}.secondary{color:var(--secondary)}.muted{color:var(--muted)}.preview{max-width:760px;margin:auto}.preview-label{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:12px;color:var(--muted);font-size:12px}.preview-label strong{color:var(--secondary);font-weight:550}.window{border:1px solid #53556d;border-radius:11px;overflow:hidden;background:var(--bg);box-shadow:0 22px 70px #0005}.titlebar{height:34px;background:#252535;display:flex;align-items:center;justify-content:center;position:relative;color:var(--secondary);font-size:11px}.lights{position:absolute;left:13px;display:flex;gap:8px}.lights button{width:11px;height:11px;border:0;padding:0;border-radius:50%;background:#f38ba8}.lights span{width:11px;height:11px;border-radius:50%;background:#f9e2af}.lights span:last-child{background:#a6e3a1}.main{padding:16px 18px 12px}.heading{display:flex;justify-content:space-between;gap:12px;align-items:center}.brand{display:flex;align-items:center;gap:10px}.brand h1{font-size:23px;margin:0;letter-spacing:-.6px;font-weight:650}.host{font-size:11px;color:var(--blue);border:1px solid #89b4fa66;border-radius:4px;padding:3px 7px}.subtitle{margin:5px 0 16px;color:var(--secondary);font-size:12px}.toolbar{display:flex;align-items:center;gap:8px;margin:14px 0 12px}.search{flex:1;min-width:70px;background:#181825;color:#fff;border:1px solid var(--border);border-radius:5px;padding:7px 10px}.count{font-size:12px;color:var(--secondary)}.count strong{color:var(--green);font-weight:600}.scope{padding:9px 11px;background:#89b4fa0a;border-left:2px solid #89b4fa80;color:var(--secondary);font-size:11px;line-height:1.6}.filters{display:flex;gap:4px;margin-bottom:12px;flex-wrap:wrap}.filters button{border:0;background:transparent;color:var(--muted);padding:5px 9px}.filters button.selected{background:var(--raised);color:#fff}.project{border:1px solid #45475a9c;border-radius:6px;background:var(--surface);margin-bottom:10px;overflow:hidden}.project-head{display:flex;align-items:center;gap:10px;padding:10px 12px 8px}.project-name{font-weight:650;font-size:14px}.project-path{color:var(--muted);font-size:10px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}.project-total{color:var(--secondary);font-size:10px}.project summary{cursor:pointer;list-style:none}.project summary::-webkit-details-marker{display:none}.role{display:grid;grid-template-columns:42px minmax(95px,1fr) 90px 165px;align-items:center;gap:8px;min-height:43px;margin:0 12px;padding:6px 0;border-top:1px solid #45475a60}.harness{font-size:11px;font-weight:700;letter-spacing:.3px}.harness.cc{color:var(--peach)}.harness.cdx{color:var(--green)}.state{font-size:12px}.state.running{color:var(--green)}.state.stopped{color:var(--secondary)}.state.problem{color:var(--yellow)}.connections{font-size:11px;color:var(--muted)}.connections.active{color:var(--blue)}.actions{display:flex;justify-content:flex-end;gap:5px}.actions button{min-width:52px;padding:4px 9px;font-size:11px}.actions button.stop{background:transparent;color:var(--secondary)}.actions button.stop:hover:not(:disabled){color:var(--red);border-color:var(--red)}.project-detail{border-top:1px solid #45475a60;margin:0 12px;padding:7px 0 9px;color:var(--muted);font-size:11px}.detail-content{padding-top:10px;line-height:1.8}.footer{display:flex;justify-content:space-between;gap:8px;padding-top:3px;color:var(--muted);font-size:10px}.resources{border-top:1px solid var(--border);padding:12px 0 8px;margin-top:14px}.resources summary{cursor:pointer;color:var(--secondary);font-size:11px}.resource-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;padding-top:12px;font-size:11px}.bar{height:4px;background:var(--raised);margin:8px 0;border-radius:2px}.bar i{display:block;width:38%;height:100%;background:var(--blue);border-radius:2px}.resource-grid p{margin:4px 0;color:var(--muted);line-height:1.65}.notice{margin:0 0 12px;padding:10px 12px;border-radius:5px;border:1px solid #f9e2af66;color:var(--yellow);line-height:1.6;background:#f9e2af08}.notice button{margin-left:8px}.empty{padding:34px 12px;text-align:center;color:var(--secondary)}.scenario{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:16px;color:var(--muted);font-size:11px}.scenario select{background:var(--bg);color:var(--fg);border:1px solid var(--border);padding:5px;border-radius:4px}.preview-note{margin-top:10px;color:var(--muted);font-size:11px;line-height:1.8}.closed{padding:70px 24px;text-align:center}.closed h2{font-size:18px;font-weight:600}.closed p{color:var(--secondary);line-height:1.8}.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);max-width:calc(100vw - 24px);background:#45475a;color:white;padding:11px 16px;border-radius:7px;box-shadow:0 8px 24px #0007;font-size:12px;z-index:10}.toast:empty{display:none}dialog{background:#242434;color:var(--fg);border:1px solid #585b70;border-radius:10px;max-width:430px;width:calc(100% - 30px);padding:22px;box-shadow:0 20px 70px #0009}dialog::backdrop{background:#0007}dialog h2{font-size:17px;margin:0 0 12px}dialog p{color:var(--secondary);font-size:12px;line-height:1.8}dialog label{display:block;font-size:12px;margin:14px 0 5px}dialog input{width:100%;background:#181825;color:#fff;border:1px solid var(--border);border-radius:5px;padding:8px}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:22px}.heading-actions{display:flex;gap:6px;align-items:center}details.bulk{position:relative}.bulk summary{list-style:none;font-size:18px;cursor:pointer;padding:0 7px;border:1px solid var(--border);border-radius:5px}.bulk-menu{position:absolute;right:0;top:28px;background:var(--raised);border:1px solid var(--border);border-radius:5px;padding:5px;z-index:3;min-width:170px}.bulk-menu button{border:0;width:100%;text-align:left}.bulk-menu button:last-child{color:var(--red)}
@media(max-width:570px){body{padding:12px 8px}.main{padding:13px 12px}.role{grid-template-columns:36px minmax(75px,1fr) 132px;gap:5px}.connections{grid-column:2;grid-row:auto;font-size:10px}.role .state{grid-column:2}.actions{grid-column:3;grid-row:1 / span 2;align-self:center}.role{position:relative;padding:8px 0;row-gap:2px}.harness{grid-row:1 / span 2}.actions button{min-width:44px;padding:5px 7px}.project-head{gap:6px}.project-path{display:none}.heading-actions button{padding:5px 7px}.brand h1{font-size:21px}.toolbar{flex-wrap:wrap}.search{width:100%}.resource-grid{grid-template-columns:1fr}.preview-label{font-size:10px}.host{font-size:10px}}
</style>
<div class="preview" id="server-preview">
  <div class="preview-label"><strong>サーバー管理 / 操作プレビュー</strong><span>サンプル状態・実機への接続なし</span></div>
  <div class="window">
    <div class="titlebar"><div class="lights"><button id="close-window" aria-label="管理画面を閉じる（プレビュー）" title="画面を閉じてもセッションは継続"></button><span></span><span></span></div>tproj — このMac</div>
    <div class="main" id="app"></div>
  </div>
  <div class="scenario"><label for="scenario">状態の例</label><select id="scenario"><option value="normal">通常：6セッション稼働</option><option value="mixed">停止・要確認あり</option><option value="connected">接続中の画面あり</option><option value="unavailable">状態の取得エラー</option></select><button class="quiet" id="reset">初期状態に戻す</button></div>
  <div class="preview-note">「開く」「停止」「プロジェクトを追加」、検索・絞り込みを試せます。画面を閉じる動作もプレビューでき、セッションの状態は保持されます。</div>
</div>
<dialog id="confirm"><h2 id="confirm-title"></h2><p id="confirm-body"></p><div class="dialog-actions"><button id="cancel">キャンセル</button><button class="danger" id="confirm-action">終了する</button></div></dialog>
<dialog id="add"><h2>このMacにプロジェクトを追加</h2><p>追加するだけではセッションを起動しません。登録後、必要なCC・Cdxを選んで起動できます。</p><form id="add-form"><label for="alias">表示名</label><input id="alias" placeholder="Project Delta" required><label for="path">プロジェクトのフォルダ</label><input id="path" placeholder="/work/project-delta" required pattern="/.*"><div class="dialog-actions"><button type="button" id="add-cancel">キャンセル</button><button class="primary">追加</button></div></form></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
(() => {
const root = document.getElementById('server-preview');
const app = document.getElementById('app');
const confirmDialog = document.getElementById('confirm');
const addDialog = document.getElementById('add');
const original = ['Alpha','Beta','Gamma'].map((name,index)=>({id:'p'+index,name:'Project '+name,path:'/work/project-'+name.toLowerCase(),cc:{state:'running',connections:0},cdx:{state:'running',connections:0}}));
let projects=structuredClone(original), filter='all', query='', closed=false, unavailable=false, pending=null, toastTimer;
const roles=['cc','cdx'];
const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const all = () => projects.flatMap(p=>roles.map(role=>({project:p,role,...p[role]})));
const label = s => ({running:'稼働中',stopped:'停止',occupied:'要確認',unavailable:'状態不明'}[s] || '状態不明');
function toast(text){document.getElementById('toast').textContent=text;clearTimeout(toastTimer);toastTimer=setTimeout(()=>document.getElementById('toast').textContent='',4000)}
function ask(title,body,action,label='終了する'){pending=action;document.getElementById('confirm-action').textContent=label;document.getElementById('confirm-action').className=label==='閉じる'?'':'danger';document.getElementById('cancel').hidden=label==='閉じる';document.getElementById('confirm-title').textContent=title;document.getElementById('confirm-body').textContent=body;confirmDialog.showModal()}
function setScenario(mode){projects=structuredClone(original);unavailable=mode==='unavailable';closed=false;filter='all';query='';if(mode==='mixed'){projects[1].cc.state='stopped';projects[2].cdx.state='occupied'}if(mode==='connected'){projects[0].cdx.connections=2;projects[1].cc.connections=1}render()}
function roleHTML(p,role){const data=p[role],s=unavailable?'unavailable':data.state;const run=s==='running',stop=s==='stopped';const tone=run?'running':stop?'stopped':'problem';return `<div class="role"><span class="harness ${role}">${role==='cc'?'CC':'Cdx'}</span><span class="state ${tone}">${label(s)}</span><span class="connections ${data.connections&&run?'active':''}">${run?(data.connections?'接続 '+data.connections:'接続なし・継続中'):stop?'未起動':'確認が必要'}</span><div class="actions">${run?`<button data-action="open" data-project="${p.id}" data-role="${role}">開く ↗</button><button class="stop" data-action="stop" data-project="${p.id}" data-role="${role}">停止</button>`:stop?`<button class="primary" data-action="start" data-project="${p.id}" data-role="${role}">起動</button>`:`<button data-action="inspect" data-project="${p.id}" data-role="${role}">確認</button>`}</div></div>`}
function render(){const entries=all(),running=unavailable?0:entries.filter(r=>r.state==='running').length,stopped=entries.filter(r=>r.state==='stopped').length,issues=unavailable?entries.length:entries.filter(r=>!['running','stopped'].includes(r.state)).length;
if(closed){app.innerHTML=`<div class="closed"><h2>管理画面を閉じました</h2><p>${unavailable?'この操作ではセッションを終了していません。現在の稼働状態は未確認です。':running+'件のセッションは、このMacで継続しています。'}<br>他の端末からの接続も、この画面を開いておく必要はありません。</p><button class="primary" id="reopen">管理画面に戻る</button></div>`;document.getElementById('reopen').onclick=()=>{closed=false;render()};return}
app.innerHTML=`<header class="heading"><div class="brand"><h1>tproj</h1><span class="host">このMac</span></div><div class="heading-actions"><button id="refresh">↻ 更新</button><button id="add-open">＋ 追加</button><details class="bulk"><summary aria-label="一括操作">⋯</summary><div class="bulk-menu"><button id="start-all" ${!stopped||unavailable?'disabled':''}>停止中をまとめて起動</button><button id="stop-all" ${!running||unavailable?'disabled':''}>全セッションを停止…</button></div></details></div></header><div class="subtitle">このMacのセッションを管理</div><div class="scope">このウィンドウを閉じてもセッションは継続します。終了する場合は、各行の「停止」を使います。</div><div class="toolbar"><input class="search" id="search" type="search" aria-label="プロジェクトを検索" placeholder="プロジェクト名・フォルダで検索" value="${esc(query)}"><span class="count">${unavailable?'状態を取得できません':`<strong>${running}</strong> / ${entries.length} 稼働`}</span></div><nav class="filters" aria-label="状態で絞り込み">${[['all','すべて',entries.length],['running','稼働中',running],['stopped','停止',stopped],['issues','要確認',issues]].map(([key,title,count])=>`<button data-filter="${key}" class="${filter===key?'selected':''}" aria-pressed="${filter===key}">${title} ${count}</button>`).join('')}</nav>${unavailable?'<div class="notice">状態を取得できません。停止したとは判断せず、起動・停止を保留しています。<button id="retry">再取得</button></div>':''}<div id="projects"></div><details class="resources"><summary>このMacの状態・運用設定</summary><div class="resource-grid"><div><strong>メモリ（表示例）</strong><div class="bar"><i></i></div><p>使用 9.1 / 24 GB · 空き 14.9 GB</p><p>一覧の更新と、メモリの取得は別に表示します。</p></div><div><strong>通信サービス</strong><p>MSG疎通：未取得</p><p>稼働中のセッションと、MSGの疎通は別の状態です。</p><p>CCキャッシュ維持はセッションの寿命を変更しません。</p></div></div></details><footer class="footer"><span>${projects.length} プロジェクト / ${entries.length} セッション</span><span>最終取得：${unavailable?'取得失敗':'たった今（表示例）'}</span></footer>`;
const visible=projects.map(p=>{const matching=roles.filter(role=>{const s=unavailable?'unavailable':p[role].state;return (!query||(p.name+' '+p.path+' '+role).toLowerCase().includes(query.toLowerCase()))&&(filter==='all'||filter===s||(filter==='issues'&&!['running','stopped'].includes(s)))});return {p,matching}}).filter(x=>x.matching.length);
document.getElementById('projects').innerHTML=visible.length?visible.map(({p,matching})=>`<article class="project"><div class="project-head"><span class="project-name">${esc(p.name)}</span><span class="project-path mono" title="${esc(p.path)}">${esc(p.path)}</span><span class="project-total">${unavailable?'未確認':roles.filter(r=>p[r].state==='running').length+' / 2 稼働'}</span></div>${matching.map(r=>roleHTML(p,r)).join('')}<details class="project-detail"><summary>詳細・設定</summary><div class="detail-content">フォルダ：<span class="mono">${esc(p.path)}</span><br>CC / Cdx の会話・作業内容はこの画面では表示しません。<br>状態の取得元：このMacのセッション管理<br><button class="quiet" data-action="unregister" data-project="${p.id}" ${roles.some(r=>p[r].state!=='stopped')||unavailable?'disabled':''}>登録解除</button><span> セッションを停止してから解除できます。</span></div></details></article>`).join(''):'<div class="empty">この条件のセッションはありません。</div>';
document.getElementById('search').oninput=e=>{const value=e.target.value,position=e.target.selectionStart;query=value;render();const input=document.getElementById('search');input.focus();input.setSelectionRange(position,position)};
document.getElementById('refresh').onclick=()=>toast('サンプル状態を更新しました。実機への通信は行いません。');
document.getElementById('add-open').onclick=()=>addDialog.showModal();
document.getElementById('start-all').onclick=()=>{projects.forEach(p=>roles.forEach(r=>{if(p[r].state==='stopped')p[r].state='running'}));render();toast('停止中のセッションを起動しました（プレビュー）')};
document.getElementById('stop-all').onclick=()=>ask('全セッションを終了しますか？','このMacで稼働している全セッションを終了します。他の端末から接続中のセッションも切断されます。',()=>{projects.forEach(p=>roles.forEach(r=>{if(p[r].state==='running'){p[r].state='stopped';p[r].connections=0}}));render();toast('全セッションを停止しました（プレビュー）')});
if(unavailable)document.getElementById('retry').onclick=()=>{unavailable=false;render()};
}
root.addEventListener('click',e=>{const filterButton=e.target.closest('[data-filter]');if(filterButton){filter=filterButton.dataset.filter;render();return}const button=e.target.closest('[data-action]');if(!button)return;const p=projects.find(p=>p.id===button.dataset.project),role=button.dataset.role,action=button.dataset.action;if(!p)return;
if(action==='start'){p[role].state='running';render();toast('起動しました（プレビュー）')}
if(action==='open')toast(p.name+' / '+(role==='cc'?'CC':'Cdx')+' の既存セッションを開きます（プレビュー）');
if(action==='inspect')ask('状態の確認：'+p.name+' / '+(role==='cc'?'CC':'Cdx'),unavailable?'管理情報を取得できていません。「再取得」で確認してください。':'想定したCLI以外のプロセスがあるため、自動的な起動・停止はしません。対象が確認できるまで、この行の起動・停止は行いません。',()=>{},'閉じる');
if(action==='stop'){const stop=()=>{p[role].state='stopped';p[role].connections=0;render();toast('停止しました（プレビュー）')};if(p[role].connections)ask(p.name+' / '+(role==='cc'?'CC':'Cdx')+' を終了しますか？',p[role].connections+'件の画面が接続中です。終了すると、接続している画面からも利用できなくなります。',stop);else stop()}
if(action==='unregister'){projects=projects.filter(item=>item.id!==p.id);render();toast('登録だけを解除しました。フォルダや履歴は削除しません。')}
});
document.getElementById('close-window').onclick=()=>{closed=true;render()};
document.getElementById('scenario').onchange=e=>setScenario(e.target.value);
document.getElementById('reset').onclick=()=>{document.getElementById('scenario').value='normal';setScenario('normal')};
document.getElementById('cancel').onclick=()=>{pending=null;confirmDialog.close()};
document.getElementById('confirm-action').onclick=()=>{const action=pending;pending=null;confirmDialog.close();if(action)action()};
document.getElementById('add-cancel').onclick=()=>addDialog.close();
document.getElementById('add-form').onsubmit=e=>{e.preventDefault();const name=document.getElementById('alias').value.trim(),path=document.getElementById('path').value.trim();if(!name||!path.startsWith('/'))return;if(projects.some(p=>p.path===path)){toast('このフォルダは登録済みです。');return}projects.push({id:'p'+Date.now(),name,path,cc:{state:'stopped',connections:0},cdx:{state:'stopped',connections:0}});addDialog.close();e.target.reset();filter='all';query='';render();toast('プロジェクトを追加しました。セッションは停止中です。')};
render();
})();
</script>
</html>
